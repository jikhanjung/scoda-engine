name: scoda-server

services:
  app:
    image: honestjung/scoda-server:0.3.9
    container_name: scoda-server
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      # 기본은 127.0.0.1 에만 연다 — 운영(dolfinid)은 nginx 가 127.0.0.1:8081 로 프록시한다 (2026-11-06,
      # 0.0.0.0:8081 이 외부 IP 로 열려 있던 것). 모든 인터페이스에 열려면 SCODA_PUBLIC_PORT=8081.
      - "${SCODA_PUBLIC_PORT:-127.0.0.1:8081}:8081"
    environment:
      - SCODA_PATH=/data/
      - SCODA_MODE=viewer
      - SCODA_WORKERS=${SCODA_WORKERS:-2}
      - SCODA_LOG_LEVEL=${SCODA_LOG_LEVEL:-info}
      - SCODA_HUB_SYNC=1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/healthz')"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped
